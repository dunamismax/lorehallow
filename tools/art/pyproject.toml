[project]
name = "lorehallow-art"
version = "0.1.0"
description = "Lorehallow art intake pipeline: generated images to true pixel art"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.3",
  "pillow>=12.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
lorehallow-art = "lorehallow_art.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length; long strings and messages may run over.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # × and typographic quotes are intended

[tool.pytest.ini_options]
testpaths = ["tests"]
