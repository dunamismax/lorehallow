# Code generation, run from the repository root by `make proto`.
# Output paths are relative to the repository root.
version: v2
plugins:
  # Go: writes server/internal/pb/*.pb.go (go_package .../server/internal/pb).
  - local: bin/protoc-gen-go
    out: server
    opt: module=github.com/dunamismax/lorehallow/server
  # GDScript is generated by godobuf from tools/scripts/gen-proto.sh, not
  # by a buf plugin. See docs/decisions/0003-gdscript-protobuf.md.
