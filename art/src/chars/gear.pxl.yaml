# Gear parts for the adventurers built from the hero (character_lineup.py):
# frame 0 round shield 9×10, frame 1 bow 9×22, frame 2 staff 9×26,
# frame 3 pointed hat 16×12, frame 4 feathered cap 16×12, frame 5 lute 9×12,
# frame 6 helmet plume 16×12. All share one 16×26 grid; unused space is
# transparent, and the script crops each part.
