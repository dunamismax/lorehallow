# Batch 02: brand and website art. Schema: tools/art/src/lorehallow_art/manifest.py
# Web art uses the same palette and rules at larger logical sizes, and is
# always shown at whole-number scales. The logo, emblems, icons, landmarks
# and lineup are hand-drawn (art/src/, ADR 0004); the large painted images
# stay generated and go through intake.
batch: "02"
title: Brand and website art
palette: art/style/palette.hex
key_color: "#FF00FF"
assets:
  - id: logo_wordmark
    target: web/logo_wordmark.png
    source: web/logo_wordmark.py
    kind: web
    size: [192, 64]
    notes: Shown at 2x to 4x in the site header and hero. Transparent background.

  - id: emblem
    target: icons/emblem.png
    source: icons/emblem.py
    kind: web
    size: [32, 32]
    notes: Square emblem. Source for the 32, 192 and 512 px favicons and the client app icon.

  - id: emblem_16
    target: icons/emblem_16.png
    source: icons/emblem_16.pxl.yaml
    kind: web
    size: [16, 16]
    notes: Hand-reduced emblem for the 16 px favicon (pixel art can't be halved cleanly).

  - id: hero_scene_painted
    prompt: 02-04
    target: web/hero_scene_painted.png
    kind: web
    size: [240, 160]
    notes: >
      The generated painting under hero_scene (large painted scene, so it is
      generated). Its adventurers are the old generated designs; hero_scene
      paints them out and puts the hand-drawn adventurers in their place.

  - id: hero_scene
    source: web/hero_scene.py
    target: web/hero_scene.png
    kind: web
    size: [240, 160]
    notes: >
      Landing-page key art: the painted village (hero_scene_painted) with its
      figures replaced by the hand-drawn adventurers from character_lineup.

  - id: parallax_far
    prompt: 02-05
    target: web/parallax_far.png
    kind: web
    size: [240, 160]
    notes: Back layer, fully opaque sky and distant hills.

  - id: parallax_mid
    prompt: 02-06
    target: web/parallax_mid.png
    kind: web
    size: [240, 160]
    notes: Middle layer, forest edge and town roofs, transparent where the far layer shows.

  - id: parallax_near
    prompt: 02-07
    target: web/parallax_near.png
    kind: web
    size: [240, 160]
    notes: Front layer, foreground grass, ferns and a lantern post, transparent above.

  - id: character_lineup
    target: web/character_lineup.png
    source: web/character_lineup.py
    kind: web
    size: [192, 128]
    notes: Five adventurers side by side, for the landing page and /world.

  - id: section_icons
    target: icons/section_icons.png
    source: icons/section_icons.pxl.yaml
    kind: tileset
    size: [64, 64]
    grid: {cell: [16, 16], columns: 4, rows: 4}
    frames:
      count: 16
      names: [shared_world, small_but_alive, readable_art, server_decides,
              playable_milestones, explore, quest, group_up,
              fight, devlog, progress, downloads,
              world, about, faq, source]

  - id: progress_landmarks
    target: web/progress_landmarks.png
    source: web/progress_landmarks.py
    kind: tileset
    size: [160, 160]
    grid: {cell: [32, 32], columns: 5, rows: 5}
    frames:
      count: 21
      names: [phase_00_campfire, phase_01_signpost, phase_02_crossroads, phase_03_market_stall,
              phase_04_inn, phase_05_bell_tower, phase_06_training_dummies, phase_07_watchtower,
              phase_08_treasure_chest, phase_09_quest_board, phase_10_banner_camp, phase_11_bridge,
              phase_12_lighthouse, phase_13_guild_hall, phase_14_bard_stage, phase_15_harbor,
              phase_16_city_gate, phase_17_mountain_pass, phase_18_great_tree, phase_19_castle,
              phase_20_far_road]
    notes: One landmark per BUILD.md phase, drawn along the /progress quest map.

  - id: devlog_header
    prompt: 02-11
    target: web/devlog_header.png
    kind: web
    size: [240, 80]

  - id: og_card_painted
    prompt: 02-12
    target: web/og_card_painted.png
    kind: web
    size: [240, 126]
    notes: >
      The generated painting under og_card. Its traveler is the old generated
      hero; og_card replaces it with the hand-drawn one.

  - id: og_card
    source: web/og_card.py
    target: web/og_card.png
    kind: web
    size: [240, 126]
    notes: >
      Shown at exactly 5x as the 1200×630 Open Graph card background: the
      painted hills (og_card_painted) with the hand-drawn hero and lantern
      on the path.

  - id: not_found
    source: web/not_found.py
    target: web/not_found.png
    kind: web
    size: [160, 120]
    notes: >
      Art for the 404 page: the hand-drawn hero lost at a broken signpost
      where the path runs out in the woods. Hand-drawn from the game's own
      tiles and props (it replaced a generated image of the old hero).
