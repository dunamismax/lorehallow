# Uptime monitoring for lorehallow.com and play.lorehallow.com (BUILD.md
# 1.9, ADR 0013). Every five minutes a GitHub runner, outside the owner's
# network, checks both. When something has been down for five minutes it
# sends one ntfy alert, and one more when it recovers. The run that first
# finds it down also fails, so GitHub emails the owner even without ntfy.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test notification instead of checking
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # save and restore the last state in the Actions cache

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/uptime.sh
          sparse-checkout-cone-mode: false

      - name: Restore the last state
        uses: actions/cache/restore@v6
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check
        id: check
        run: deploy/uptime.sh ${{ inputs.test_alert && '--test-alert' || '' }}

      - name: Save the state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
